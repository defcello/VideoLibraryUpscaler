<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Remaster Pipeline</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <h1>AI Remaster Pipeline</h1>
    <span class="sub" id="worker-status">worker: idle</span>
</header>

<main>
    <section class="panel">
        <h2>Submit</h2>
        <div class="browse-path" id="browse-path">loading...</div>
        <div class="browse-list" id="browse-list"></div>

        <div class="field">
            <label>Selected files</label>
            <div id="selected-count" style="font-size:13px;color:var(--text-dim)">none selected</div>
        </div>

        <div class="field">
            <label class="checkbox"><input type="checkbox" id="test-crop-enabled"> Test crop (In/Out points)</label>
            <div id="test-crop-inputs" hidden style="margin-top:6px;display:flex;gap:8px">
                <input type="text" id="test-crop-start" placeholder="In (HH:MM:SS)" style="width:120px">
                <input type="text" id="test-crop-end" placeholder="Out (HH:MM:SS)" style="width:120px">
            </div>
        </div>
        <div class="field toggle-stack">
            <label class="checkbox"><input type="checkbox" id="deinterlace-enabled"> Deinterlace/IVTC</label>
            <label class="checkbox"><input type="checkbox" id="denoise-enabled"> Denoise (HandBrake NLMeans Strong)</label>
            <label class="checkbox"><input type="checkbox" id="dehalo-enabled"> Dehalo (Topaz Iris + Artemis Strong Halo)</label>
            <label class="checkbox"><input type="checkbox" id="upscale-enabled"> Upscale (Topaz Video AI)</label>
        </div>
        <div class="field">
            <label>Content type</label>
            <div class="preset-row">
                <select id="content-type" style="flex:1"></select>
                <button class="small" id="preset-toggle" title="Show Topaz processing stack">&#9654;</button>
            </div>
            <div class="kv" id="preset-details" hidden></div>
        </div>

        <div class="field">
            <button class="primary" id="submit-btn">Add to queue</button>
        </div>
    </section>

    <section class="queue">
        <table>
            <thead>
                <tr>
                    <th style="width:26%">File</th>
                    <th style="width:12%">Status</th>
                    <th style="width:24%">Stage</th>
                    <th style="width:18%">Settings</th>
                    <th style="width:16%">Updated</th>
                    <th style="width:4%"></th>
                </tr>
            </thead>
            <tbody id="job-rows"></tbody>
        </table>
        <div class="empty" id="empty-msg" style="display:none">No jobs yet -- browse and submit files on the left.</div>
    </section>
</main>

<div id="detail">
    <div class="detail-header">
        <div>
            <h3 id="detail-title">-</h3>
            <div class="sub" id="detail-id" style="color:var(--text-dim);font-size:11px"></div>
        </div>
        <div class="detail-actions">
            <button class="icon-btn" id="detail-rerun" title="Rerun: duplicate this job's settings and queue a fresh run">&#8635;</button>
            <button class="icon-btn" id="detail-abort" title="Abort this job">&#9632;</button>
            <button class="close-btn" id="detail-close">&times;</button>
        </div>
    </div>
    <div class="detail-body" id="detail-body"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
